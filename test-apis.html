<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste de APIs</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #fff; }
    h1 { color: #e94560; }
    .api-result { padding: 10px; margin: 10px 0; border-radius: 8px; }
    .success { background: #0f3d0f; border: 2px solid #4caf50; }
    .error { background: #3d0f0f; border: 2px solid #f44336; }
    .testing { background: #3d3d0f; border: 2px solid #ffeb3b; }
    .loading { color: #ffeb3b; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; }
    th { background: #16213e; }
    #games-table { display: none; }
  </style>
</head>
<body>
  <h1>Teste de APIs - Sistema de Fallback</h1>
  
  <div id="status"></div>
  
  <h2>Jogos Encontrados</h2>
  <div id="games-count">Aguardando...</div>
  
  <table id="games-table">
    <thead>
      <tr>
        <th>Hora</th>
        <th>Casa</th>
        <th>Fora</th>
        <th>Campeonato</th>
        <th>Status</th>
        <th>1</th>
        <th>X</th>
        <th>2</th>
      </tr>
    </thead>
    <tbody id="games-body"></tbody>
  </table>

  <script>
    const API_CONFIG = {
      apis: [
        { name: "API-Football Nova 1", key: "d096e762ddd15d82d9135366e65d6de050a8b8676d7549af6c83227887d17ae9", endpoint: "https://v3.football.api-sports.io" },
        { name: "API-Football Nova 2", key: "425257ac2bf87e2552ba95c5509693af", endpoint: "https://v3.football.api-sports.io" },
        { name: "API-Football Nova 3", key: "fe80bd94-093e-4e97-8b6e-ccd2a07e3514", endpoint: "https://v3.football.api-sports.io" },
        { name: "API-Football Atual", key: "6512896b81baf1e82ea25425879bbc60", endpoint: "https://v3.football.api-sports.io" }
      ],
      fallback: { name: "Supabase", url: "https://uagwqerjcjjlnftytkqe.supabase.co/functions/v1/api-football/jogos" }
    };

    function addStatus(text, type) {
      const div = document.createElement("div");
      div.className = `api-result ${type}`;
      div.innerHTML = text;
      document.getElementById("status").appendChild(div);
    }

    async function testApiFootball(api) {
      const today = new Date().toISOString().split("T")[0];
      const url = `${api.endpoint}/fixtures?date=${today}&timezone=America/Sao_Paulo`;
      
      try {
        const response = await fetch(url, {
          headers: { "x-apisports-key": api.key },
          signal: AbortSignal.timeout(10000)
        });
        
        if (!response.ok) return { success: false, error: `HTTP ${response.status}`, name: api.name };
        
        const data = await response.json();
        
        if (data.errors && Object.keys(data.errors).length > 0) {
          return { success: false, error: data.errors.token || "Erro na API", name: api.name };
        }
        
        if (data.results > 0) {
          return { success: true, name: api.name, count: data.results, fixtures: data.response };
        }
        
        return { success: false, error: "0 jogos", name: api.name };
        
      } catch (error) {
        return { success: false, error: error.message, name: api.name };
      }
    }

    function parseDate(dateStr) {
      if (!dateStr) return { data: "Hoje", hora: "--:--" };
      const date = new Date(dateStr);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      const matchDate = new Date(date);
      matchDate.setHours(0, 0, 0, 0);
      
      let dataStr = "Hoje";
      if (matchDate.getTime() === today.getTime()) dataStr = "Hoje";
      else if ((matchDate.getTime() - today.getTime()) / 86400000 === 1) dataStr = "Amanha";
      else dataStr = date.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
      
      const hora = date.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
      return { data: dataStr, hora };
    }

    function reduceOdd(odd) {
      return Math.max(1.01, Math.round(odd * 0.85 * 100) / 100);
    }

    function transformFixtures(fixtures) {
      return fixtures.map(f => {
        const teams = f.teams || {};
        const goals = f.goals || {};
        const league = f.league || {};
        const status = f.fixture?.status || {};
        const { hora } = parseDate(f.fixture?.date);
        
        const home = teams.home?.name || "Mandante";
        const away = teams.away?.name || "Visitante";
        const shortStatus = status.short || "NS";
        
        // Gerar odds ficticios mas realistas
        const baseHome = 1.5 + Math.random() * 2;
        const baseDraw = 2.5 + Math.random() * 1.5;
        const baseAway = 1.5 + Math.random() * 2;
        
        return {
          hora,
          time_casa: home,
          time_fora: away,
          campeonato: league.name || "Campeonato",
          status: shortStatus === "NS" ? "Pre-jogo" : (shortStatus === "FT" ? "Encerrado" : "Ao vivo"),
          placar: goals.home !== null ? `${goals.home} - ${goals.away}` : null,
          odds_1x2: {
            casa: reduceOdd(baseHome),
            empate: reduceOdd(baseDraw),
            fora: reduceOdd(baseAway)
          }
        };
      });
    }

    function renderGames(jogos) {
      const tbody = document.getElementById("games-body");
      const table = document.getElementById("games-table");
      document.getElementById("games-count").textContent = `${jogos.length} jogos encontrados`;
      
      tbody.innerHTML = "";
      
      jogos.forEach(j => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${j.hora}</td>
          <td>${j.time_casa}</td>
          <td>${j.time_fora}</td>
          <td>${j.campeonato}</td>
          <td>${j.status} ${j.placar ? `(${j.placar})` : ""}</td>
          <td>${j.odds_1x2.casa.toFixed(2)}</td>
          <td>${j.odds_1x2.empate.toFixed(2)}</td>
          <td>${j.odds_1x2.fora.toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
      });
      
      table.style.display = "table";
    }

    async function run() {
      addStatus("<span class='loading'>Iniciando teste de APIs...</span>", "testing");
      
      // 1. Testar APIs em ordem
      for (const api of API_CONFIG.apis) {
        addStatus(`Testando ${api.name}...`, "testing");
        
        const result = await testApiFootball(api);
        
        if (result.success) {
          addStatus(`<strong>${result.name}</strong> - FUNCIONANDO! (${result.count} jogos)`, "success");
          
          const jogos = transformFixtures(result.fixtures);
          renderGames(jogos);
          return;
        } else {
          addStatus(`<strong>${result.name}</strong> - FALHOU: ${result.error}`, "error");
        }
      }
      
      // 2. Todas falharam - usar Supabase
      addStatus("Todas as APIs falharam. Tentando Supabase...", "testing");
      
      try {
        const response = await fetch(API_CONFIG.fallback.url, { cache: "no-store" });
        if (response.ok) {
          const data = await response.json();
          const jogos = data.jogos || data || [];
          
          if (jogos.length > 0) {
            addStatus(`<strong>Supabase</strong> - FUNCIONANDO! (${jogos.length} jogos)`, "success");
            renderGames(jogos.map(j => ({
              hora: j.hora || "--:--",
              time_casa: j.time_casa || j.home || "Casa",
              time_fora: j.time_fora || j.away || "Fora",
              campeonato: j.campeonato || "Campeonato",
              status: j.status || "Pre-jogo",
              placar: j.placar,
              odds_1x2: j.odds_1x2 || { casa: 2.0, empate: 3.0, fora: 3.5 }
            })));
            return;
          }
        }
      } catch (error) {
        addStatus(`Supabase - FALHOU: ${error.message}`, "error");
      }
      
      addStatus("<strong>NENHUMA API FUNCIONOU!</strong> Verifique suas chaves de API.", "error");
    }

    run();
  </script>
</body>
</html>
