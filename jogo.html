<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes do Jogo - Bet Local</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="match">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Bet Local">
      <span class="brand-mark">BL</span>
      <span data-brand-name>Bet Local</span>
    </a>
    <nav class="main-nav" aria-label="Navegação principal">
      <a href="index.html">Voltar</a>
      <a class="active" href="#">Mercados</a>
      <a href="login.html">Admin</a>
      <a href="operador.html">Operador</a>
    </nav>
    <div class="topbar-actions">
      <span class="cashier-status">Odds fixadas no bilhete</span>
    </div>
  </header>

  <section class="match-banner" id="match-banner"></section>

  <div class="match-layout">
    <main class="market-container">
      <div class="market-toolbar">
        <div>
          <h2>Mercados disponíveis</h2>
          <p>Selecione uma odd para adicionar ao cupom lateral.</p>
        </div>
        <a class="outline-link" href="index.html">Ver outros jogos</a>
      </div>
      <section id="mercados-container" class="markets-stack" aria-live="polite"></section>
    </main>

    <aside class="ticket-sidebar" aria-label="Cupom de apostas">
      <div class="ticket-header">
        <div>
          <span>Cupom</span>
          <h2>Meu bilhete</h2>
        </div>
        <button id="limpar-ticket" class="ghost-btn" type="button">Limpar</button>
      </div>

      <div id="ticket-list" class="ticket-list"></div>

      <div class="ticket-footer">
        <label class="field-label" for="valor-aposta">Valor da aposta</label>
        <div class="money-input">
          <span>R$</span>
          <input type="number" id="valor-aposta" placeholder="20,00" min="1" step="0.01">
        </div>
        <div class="ticket-row">
          <span>Odd total</span>
          <strong id="odd-total">1.00</strong>
        </div>
        <div class="ticket-row">
          <span>Possível retorno</span>
          <strong id="retorno-total">R$ 0,00</strong>
        </div>
        <button id="gerar-codigo" class="primary-btn" type="button">Gerar comprovante</button>
        <div id="codigo-gerado" class="receipt-output" aria-live="polite"></div>
      </div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/tenant.js"></script>
  <script src="js/league-mapping.js"></script>
  <script src="js/app.js"></script>
  <script src="js/jogo.js"></script>
</body>
</html>
