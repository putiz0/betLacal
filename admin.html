<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Bet Local</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <a class="brand admin-brand" href="index.html" aria-label="Bet Local">
        <span class="brand-mark">BL</span>
        <span>Bet Local</span>
      </a>
      <nav class="admin-nav" aria-label="Navegação administrativa">
        <a class="active" href="#dashboard">Dashboard</a>
        <a href="#apostas">Apostas</a>
        <a href="#financeiro">Financeiro</a>
        <a href="#estatisticas">Estatísticas</a>
        <a href="index.html">Tela de vendas</a>
      </nav>
    </aside>

    <main class="admin-content">
      <header class="admin-topbar">
        <div>
          <span class="eyebrow">Painel do operador</span>
          <h1>Controle presencial de apostas</h1>
        </div>
        <div class="admin-search">
          <input id="buscar-codigo" type="search" placeholder="Consultar código da aposta">
          <button id="limpar-busca" class="ghost-btn" type="button">Limpar</button>
        </div>
      </header>

      <section class="stats-grid" id="admin-stats"></section>

      <section class="admin-grid">
        <div class="admin-table-box" id="apostas">
          <div class="table-header">
            <div>
              <h2>Apostas registradas</h2>
              <p>Atualize o status conforme conferência e pagamento no caixa.</p>
            </div>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Data</th>
                  <th>Seleções</th>
                  <th>Odd</th>
                  <th>Valor</th>
                  <th>Retorno</th>
                  <th>Status</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabela-apostas"></tbody>
            </table>
          </div>
        </div>

        <aside class="admin-panel" id="estatisticas">
          <h2>Estatísticas</h2>
          <div id="admin-insights" class="insight-list"></div>
        </aside>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
